# General-purpose "real-world document OCR" distribution profile.
#
# Numbers marked [sourced] come from published dataset statistics.
# Numbers marked [prior] are engineering priors that should be re-fit with
#   uv run main.py distribution measure --images <real images> --emit-profile ...
# once you have a reference image set (see docs/distribution.md).
id: real_world_v1
version: "1"
description: >
  Mixed born-digital / scanned / photographed pages. Document family mix and
  block weights follow DocLayNet page and element statistics; scan skew follows
  ADF scanner measurements; capture-channel mix and degradation ranges are
  priors informed by OmniDocBench page attributes (fuzzy scan, watermark,
  colorful background) and should be calibrated against your target data.

sources:
  - name: DocLayNet
    url: https://github.com/DS4SD/DocLayNet
    used_for: family_mix, block_weights
    notes: >
      80,863 pages. Categories: Financial Reports 32%, Manuals 21%, Scientific
      Articles 17%, Laws & Regulations 16%, Patents 8%, Government Tenders 6%.
      Element instances: Text 510,377; List-item 185,660; Section-header
      142,884; Page-footer 70,878; Page-header 58,022; Picture 45,976;
      Table 34,733; Formula 25,027; Caption 22,524; Footnote 6,318; Title 5,071.
  - name: OmniDocBench
    url: https://github.com/opendatalab/OmniDocBench
    used_for: capture channel taxonomy (fuzzy_scan / watermark / colorful_background attributes)
  - name: ADF scanner skew study
    url: https://www.researchgate.net/publication/224341611_Estimating_the_Skew_Angle_of_Scanned_Document_through_Background_Area_Information
    used_for: scanned.skew_deg
    notes: 300 A4 sheets through an automatic feeder; 3 sigma of skew within +-1.5 deg.

# DocLayNet category -> template family mapping [sourced, then blended]:
#   Financial Reports 32% + Laws 16%       -> business   (48%)
#   Manuals 21% + half of Patents 4%       -> technical  (25%)
#   Scientific 17% + half of Patents 4%    -> academic   (21%)
#   Government Tenders 6%                  -> forms      (6%)
# DocLayNet has no receipts / meeting notes / forms, which are common in OCR
# workloads, so 20% of the mass is moved to forms + operations [prior].
family_mix:
  business: 0.38
  technical: 0.20
  academic: 0.17
  forms: 0.15
  operations: 0.10

# Relative weights for filling non-required block slots [sourced from DocLayNet
# element shares]. List-items are counted per item in DocLayNet but our list
# blocks hold 3-5 items, so list shares are divided by ~4. Captions and
# footnotes are folded into paragraph. Headers/titles are produced by the
# composer structurally and are not weighted here.
block_weights:
  paragraph: 48.7
  bullet_list: 2.1
  numbered_list: 1.5
  checklist: 0.6
  image: 4.2
  table: 3.1
  formula: 2.3
  quote: 0.8
  code: 0.8
  command: 0.4
  rule: 0.4

# Physical typography on a virtual A4 page [prior: typical 9-12pt body text].
typography:
  body_font_pt: {normal: [10.5, 0.8], clip: [8.5, 13.0], round: 1}
  line_spacing: {normal: [1.38, 0.12], clip: [1.1, 1.8], round: 2}
  colored_background: {p: 0.12}   # [prior] share of pages with a non-white background

capture_channels:
  born_digital:
    weight: 0.50
    # PDF rasterisation resolutions commonly used by OCR pipelines.
    dpi: {choices: [96, 144, 200], weights: [0.25, 0.45, 0.30]}
    degradations:
      jpeg_quality: {choices: [null, 95, 85], weights: [0.6, 0.25, 0.15]}

  scanned:
    weight: 0.35
    dpi: {choices: [150, 200, 300], weights: [0.20, 0.30, 0.50]}
    degradations:
      skew_deg: {normal: [0.0, 0.5], clip: [-3.0, 3.0], round: 2}   # [sourced]
      paper_tint: {p: 0.6}
      ink_fade: {beta: [2, 6], range: [0.0, 0.45], round: 3}
      bleed_through: {beta: [1.2, 12], range: [0.0, 0.2], round: 3}
      blur_sigma: {lognormal: [-0.9, 0.45], clip: [0.0, 1.6], round: 2}
      noise_sigma: {lognormal: [1.0, 0.5], clip: [0.0, 12.0], round: 2}
      speckle_density: {beta: [1.2, 400], range: [0.0, 0.01], round: 5}
      grayscale: {p: 0.5}
      binarize: {p: 0.08}
      jpeg_quality: {normal: [82, 8], clip: [45, 95], round: 0}

  photographed:
    weight: 0.15
    dpi: {normal: [160, 40], clip: [90, 300], round: 0}
    degradations:
      skew_deg: {normal: [0.0, 2.5], clip: [-8.0, 8.0], round: 2}
      perspective: {beta: [2, 10], range: [0.0, 0.08], round: 4}
      illumination: {beta: [2, 4], range: [0.0, 0.45], round: 3}
      shadow_strength: {beta: [1.5, 5], range: [0.0, 0.5], round: 3}
      blur_sigma: {lognormal: [-0.4, 0.5], clip: [0.0, 2.5], round: 2}
      motion_blur_px: {choices: [0, 0, 0, 3, 5, 7], round: 0}
      noise_sigma: {lognormal: [1.6, 0.4], clip: [0.0, 18.0], round: 2}
      paper_tint: {p: 0.8}
      jpeg_quality: {normal: [75, 10], clip: [35, 95], round: 0}
