# Korean public-administration style documents: mostly scanned archives,
# forms and reports, older and lower quality than general office PDFs.
#
# The AI Hub "공공행정문서 OCR" dataset (900k images, 25M words) describes its
# source pages as older administrative records with poor scan/photo quality and
# mixed printed / typewritten / handwritten text. Exact per-attribute ratios are
# not public outside the AI Hub portal, so every ratio here is a [prior].
# Re-fit it with `distribution measure` on images you are licensed to use.
id: ko_admin_scan_v1
version: "1"
description: >
  Scan-heavy Korean administrative documents (forms, notices, reports).
  Lower DPI, stronger skew/blur/noise and more binarized pages than
  real_world_v1.

sources:
  - name: AI Hub 공공행정문서 OCR
    url: https://aihub.or.kr/aihubdata/data/view.do?dataSetSn=88
    used_for: channel mix and degradation direction (qualitative)
  - name: ADF scanner skew study
    url: https://www.researchgate.net/publication/224341611_Estimating_the_Skew_Angle_of_Scanned_Document_through_Background_Area_Information
    used_for: scanned.skew_deg baseline (widened for archive scans)

family_mix:
  forms: 0.35
  business: 0.30
  operations: 0.25
  technical: 0.05
  academic: 0.05

# [prior] Pages of nothing but display formulas do not occur in administrative
# documents. Table-only pages (budget and status tables) are common, so
# table_heavy keeps its default weight.
template_weights:
  formula_heavy: 0.0

# [prior] Real scans carry no look-alike typos; keep image and GT text natural.
# Table content uses coherent schemas (semantic columns, internally-consistent
# numbers). Korean public-administration archives are dominated by budget
# execution tables, meeting/event schedules and staff rosters rather than
# financial statements, so those three schemas get most of the weight.
content:
  similar_char_ratio: 0.0
  table_schemas: {budget: 3, schedule: 3, roster: 2, order: 1, financial: 1}

block_weights:
  paragraph: 40
  table: 12
  numbered_list: 4
  bullet_list: 2
  checklist: 2
  quote: 1
  rule: 1
  image: 1
  formula: 0.2
  code: 0.2
  command: 0.1

typography:
  body_font_pt: {normal: [11.0, 1.0], clip: [9.0, 14.0], round: 1}
  line_spacing: {normal: [1.5, 0.15], clip: [1.15, 1.9], round: 2}
  colored_background: {p: 0.05}   # [prior] share of pages with a non-white background
  # [prior] Administrative documents are almost always authored in Korean
  # HWP, whose default paragraph style is justified ("양쪽정렬") body text
  # with word-break: keep-all (breaks fall between words, not mid-syllable).
  text_align: {choices: [justify, left], weights: [0.8, 0.2]}
  word_break: {choices: [keep-all, normal], weights: [0.85, 0.15]}

# Page margins on A4 (210mm wide) as CSS padding [prior]: HWP page-setup
# defaults (top 20mm + 15mm header zone = 35mm effective top margin, bottom
# 15mm, left/right 30mm) dominate since these are administrative archives;
# Word's 1-inch (25.4mm) "Normal" margins get a smaller share.
page:
  margins_mm:
    top: {choices: [35, 25.4], weights: [0.75, 0.25]}
    bottom: {choices: [15, 25.4], weights: [0.75, 0.25]}
    left: {choices: [30, 25.4], weights: [0.75, 0.25]}
    right: {choices: [30, 25.4], weights: [0.75, 0.25]}

# [prior] Same Nanum-heavy font pool as real_world_v3 (see that file's
# comment): bias body text away from NanumSquare display faces and give the
# excluded D2Coding face to code blocks instead of leaving code in the body
# font.
fonts:
  body: {Myeongjo: 3, batang: 2, Gothic: 2}
  heading: {Gothic: 3, Myeongjo: 2, NanumSquare: 1}
  code: [D2Coding]

capture_channels:
  born_digital:
    weight: 0.10
    dpi: {choices: [144, 200], weights: [0.5, 0.5]}
    degradations:
      jpeg_quality: {choices: [null, 90], weights: [0.5, 0.5]}

  scanned:
    weight: 0.70
    dpi: {choices: [150, 200, 300], weights: [0.35, 0.40, 0.25]}
    degradations:
      skew_deg: {normal: [0.0, 0.9], clip: [-4.0, 4.0], round: 2}
      paper_tint: {p: 0.8}
      ink_fade: {beta: [2, 4], range: [0.0, 0.5], round: 3}
      bleed_through: {beta: [1.5, 8], range: [0.0, 0.25], round: 3}
      blur_sigma: {lognormal: [-0.6, 0.45], clip: [0.0, 2.0], round: 2}
      noise_sigma: {lognormal: [1.4, 0.5], clip: [0.0, 16.0], round: 2}
      speckle_density: {beta: [1.5, 200], range: [0.0, 0.02], round: 5}
      grayscale: {p: 0.75}
      binarize: {p: 0.2}
      jpeg_quality: {normal: [75, 10], clip: [40, 95], round: 0}

  photographed:
    weight: 0.20
    dpi: {normal: [140, 35], clip: [90, 260], round: 0}
    degradations:
      skew_deg: {normal: [0.0, 3.0], clip: [-10.0, 10.0], round: 2}
      perspective: {beta: [2, 8], range: [0.0, 0.1], round: 4}
      illumination: {beta: [2, 3], range: [0.0, 0.5], round: 3}
      shadow_strength: {beta: [1.5, 4], range: [0.0, 0.55], round: 3}
      blur_sigma: {lognormal: [-0.3, 0.5], clip: [0.0, 2.8], round: 2}
      motion_blur_px: {choices: [0, 0, 3, 5, 7, 9], round: 0}
      noise_sigma: {lognormal: [1.8, 0.4], clip: [0.0, 20.0], round: 2}
      paper_tint: {p: 0.9}
      jpeg_quality: {normal: [70, 10], clip: [30, 92], round: 0}
