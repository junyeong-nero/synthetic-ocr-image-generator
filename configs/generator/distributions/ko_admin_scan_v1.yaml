# Korean public-administration style documents: mostly scanned archives,
# forms and reports, older and lower quality than general office PDFs.
#
# The AI Hub "공공행정문서 OCR" dataset (900k images, 25M words) describes its
# source pages as older administrative records with poor scan/photo quality and
# mixed printed / typewritten / handwritten text. Exact per-attribute ratios are
# not public outside the AI Hub portal, so every ratio here is a [prior].
# Re-fit it with `distribution measure` on images you are licensed to use.
id: ko_admin_scan_v1
version: "1"
description: >
  Scan-heavy Korean administrative documents (forms, notices, reports).
  Lower DPI, stronger skew/blur/noise and more binarized pages than
  real_world_v1.

sources:
  - name: AI Hub 공공행정문서 OCR
    url: https://aihub.or.kr/aihubdata/data/view.do?dataSetSn=88
    used_for: channel mix and degradation direction (qualitative)
  - name: ADF scanner skew study
    url: https://www.researchgate.net/publication/224341611_Estimating_the_Skew_Angle_of_Scanned_Document_through_Background_Area_Information
    used_for: scanned.skew_deg baseline (widened for archive scans)

family_mix:
  forms: 0.35
  business: 0.30
  operations: 0.25
  technical: 0.05
  academic: 0.05

# [prior] Pages of nothing but display formulas do not occur in administrative
# documents. Table-only pages (budget and status tables) are common, so
# table_heavy keeps its default weight.
template_weights:
  formula_heavy: 0.0

# [prior] Real scans carry no look-alike typos; keep image and GT text natural.
# Table content uses coherent schemas (semantic columns, internally-consistent
# numbers). Korean public-administration archives are dominated by budget
# execution tables, meeting/event schedules and staff rosters rather than
# financial statements, so those three schemas get most of the weight.
content:
  similar_char_ratio: 0.0
  table_schemas: {budget: 3, schedule: 3, roster: 2, order: 1, financial: 1}
  # [prior] Korean public-administration documents are numbered and 개조식
  # far more consistently than general office documents (see
  # src/generator/document_conventions.py): heading numbering and itemized
  # (□/○/·, 1)/가)/①) list markers dominate, and policy/notice text is
  # commonly written as 제N조 articles. AI Hub does not publish per-attribute
  # ratios, so these weights are priors, skewed harder towards the Korean
  # conventions than the general-purpose real_world_v3 profile.
  heading_numbering: {choices: [korean_admin, arabic, none], weights: [0.6, 0.25, 0.15]}
  list_style: {choices: [korean_admin, markdown], weights: [0.7, 0.3]}
  law_articles: {p: 0.7}

block_weights:
  paragraph: 40
  table: 12
  numbered_list: 4
  bullet_list: 2
  checklist: 2
  quote: 1
  rule: 1
  image: 1
  formula: 0.2
  code: 0.2
  command: 0.1

typography:
  body_font_pt: {normal: [11.0, 1.0], clip: [9.0, 14.0], round: 1}
  line_spacing: {normal: [1.5, 0.15], clip: [1.15, 1.9], round: 2}
  colored_background: {p: 0.05}   # [prior] share of pages with a non-white background
  # [prior] Administrative documents are almost always authored in Korean
  # HWP, whose default paragraph style is justified ("양쪽정렬") body text
  # with word-break: keep-all (breaks fall between words, not mid-syllable).
  text_align: {choices: [justify, left], weights: [0.8, 0.2]}
  word_break: {choices: [keep-all, normal], weights: [0.85, 0.15]}
  # [prior] Korean administrative forms/reports overwhelmingly use fully
  # gridded tables (HWP's default table style); shaded-header and web looks
  # are less common, and the borderless/booktabs academic-writing look does
  # not fit this family, so it is left out.
  table_style:
    choices: [grid, header_shaded, web]
    weights: [0.6, 0.25, 0.15]

# Page margins on A4 (210mm wide) as CSS padding [prior]: HWP page-setup
# defaults (top 20mm + 15mm header zone = 35mm effective top margin, bottom
# 15mm, left/right 30mm) dominate since these are administrative archives;
# Word's 1-inch (25.4mm) "Normal" margins get a smaller share.
page:
  margins_mm:
    top: {choices: [35, 25.4], weights: [0.75, 0.25]}
    bottom: {choices: [15, 25.4], weights: [0.75, 0.25]}
    left: {choices: [30, 25.4], weights: [0.75, 0.25]}
    right: {choices: [30, 25.4], weights: [0.75, 0.25]}

# [prior] Same Nanum-heavy font pool as real_world_v3 (see that file's
# comment): bias body text away from NanumSquare display faces and give the
# excluded D2Coding face to code blocks instead of leaving code in the body
# font.
fonts:
  body: {Myeongjo: 3, batang: 2, Gothic: 2}
  heading: {Gothic: 3, Myeongjo: 2, NanumSquare: 1}
  code: [D2Coding]

capture_channels:
  born_digital:
    weight: 0.10
    dpi: {choices: [144, 200], weights: [0.5, 0.5]}
    degradations:
      jpeg_quality: {choices: [null, 90], weights: [0.5, 0.5]}

  scanned:
    weight: 0.70
    # This is the base range every scanned page samples first; scenarios
    # below (Task 7) then override a subset per "how was this scan
    # produced", since real scan artifacts are correlated, not independent.
    dpi: {choices: [150, 200, 300], weights: [0.35, 0.40, 0.25]}
    degradations:
      skew_deg: {normal: [0.0, 0.9], clip: [-4.0, 4.0], round: 2}
      paper_tint: {p: 0.8}
      ink_fade: {beta: [2, 4], range: [0.0, 0.5], round: 3}
      bleed_through: {beta: [1.5, 8], range: [0.0, 0.25], round: 3}
      blur_sigma: {lognormal: [-0.6, 0.45], clip: [0.0, 2.0], round: 2}
      noise_sigma: {lognormal: [1.4, 0.5], clip: [0.0, 16.0], round: 2}
      speckle_density: {beta: [1.5, 200], range: [0.0, 0.02], round: 5}
      grayscale: {p: 0.75}
      binarize: {p: 0.2}
      binarize_method: {choices: [otsu, adaptive, sauvola], weights: [0.5, 0.3, 0.2]}   # [prior]
      jpeg_quality: {normal: [75, 10], clip: [40, 95], round: 0}
    # [prior] Capture scenarios (Task 7): correlated degradation bundles.
    # Administrative archives skew older/lower-quality than general office
    # PDFs, so `archive` and `photocopy` carry more weight than in
    # real_world_v3. Weights sum to 1.0 within the channel. Re-fit with
    # `distribution measure` against licensed AI Hub images.
    scenarios:
      # A recent office scan (ADF): the base range above, plus the seals,
      # mark-up, binder crease/holes, edge shadow and toner streaks Task 2
      # added (moved here, unchanged, as the default case).
      office_adf:
        weight: 0.30
        degradations:
          stamp: {p: 0.30}
          highlighter: {p: 0.08}
          fold_lines: {choices: [0, 1, 2], weights: [0.75, 0.18, 0.07]}
          punch_holes: {p: 0.35}
          scanner_border: {beta: [1.5, 10], range: [0.0, 0.6], round: 3}
          toner_streaks: {choices: [0, 0, 1, 2, 3], weights: [0.55, 0.15, 0.15, 0.1, 0.05]}
      # An older filed/archived record: heavier tint, fade and bleed-through,
      # lower dpi, and more physical wear from years in a binder.
      archive:
        weight: 0.35
        dpi: {choices: [150, 200], weights: [0.6, 0.4]}
        degradations:
          paper_tint: {p: 0.95}
          ink_fade: {beta: [2.5, 3], range: [0.1, 0.6], round: 3}
          bleed_through: {beta: [2, 5], range: [0.05, 0.35], round: 3}
          noise_sigma: {lognormal: [1.7, 0.4], clip: [0.0, 20.0], round: 2}
          stamp: {p: 0.45}
          fold_lines: {choices: [0, 1, 2], weights: [0.4, 0.4, 0.2]}
          punch_holes: {p: 0.5}
          scanner_border: {beta: [1.6, 8], range: [0.0, 0.65], round: 3}
      # A photocopy: higher contrast/threshold and toner-roller wear instead
      # of tint/bleed-through.
      photocopy:
        weight: 0.20
        degradations:
          skew_deg: {normal: [0.0, 1.3], clip: [-4.5, 4.5], round: 2}
          grayscale: {p: 1.0}
          binarize: {p: 0.4}
          toner_streaks: {choices: [0, 1, 2, 3, 4], weights: [0.25, 0.3, 0.25, 0.12, 0.08]}
          speckle_density: {beta: [1.8, 150], range: [0.0, 0.025], round: 5}
          scanner_border: {beta: [1.5, 8], range: [0.0, 0.6], round: 3}
      # A faxed page: always bitonal, low resolution, heavier speckle/noise.
      fax:
        weight: 0.15
        dpi: {choices: [100, 150], weights: [0.5, 0.5]}
        degradations:
          binarize: {p: 1.0}
          binarize_method: {choices: [otsu, adaptive, sauvola], weights: [0.4, 0.35, 0.25]}
          speckle_density: {beta: [2.2, 90], range: [0.0, 0.03], round: 5}
          noise_sigma: {lognormal: [1.3, 0.3], clip: [0.0, 14.0], round: 2}
          skew_deg: {normal: [0.0, 0.7], clip: [-2.5, 2.5], round: 2}
          jpeg_quality: {normal: [55, 10], clip: [25, 80], round: 0}

  photographed:
    weight: 0.20
    # Calibrated base; scenarios below (Task 7) override a subset per "how
    # was this photo taken".
    dpi: {normal: [140, 35], clip: [90, 260], round: 0}
    degradations:
      skew_deg: {normal: [0.0, 3.0], clip: [-10.0, 10.0], round: 2}
      perspective: {beta: [2, 8], range: [0.0, 0.1], round: 4}
      illumination: {beta: [2, 3], range: [0.0, 0.5], round: 3}
      shadow_strength: {beta: [1.5, 4], range: [0.0, 0.55], round: 3}
      blur_sigma: {lognormal: [-0.3, 0.5], clip: [0.0, 2.8], round: 2}
      motion_blur_px: {choices: [0, 0, 3, 5, 7, 9], round: 0}
      noise_sigma: {lognormal: [1.8, 0.4], clip: [0.0, 20.0], round: 2}
      paper_tint: {p: 0.9}
      jpeg_quality: {normal: [70, 10], clip: [30, 92], round: 0}
    # [prior] Capture scenarios (Task 7). Administrative files are more
    # often photographed bound (in a folder) or under poor office lighting
    # than laid flat, so `phone_book` and `low_light` carry more weight than
    # in real_world_v3. Weights sum to 1.0 within the channel.
    scenarios:
      # Page laid flat: little book curvature or missed border.
      phone_flat:
        weight: 0.35
        degradations:
          page_curl: {beta: [1.2, 50], range: [0.0, 0.02], round: 4}
          edge_crop: {beta: [1.3, 30], range: [0.0, 0.05], round: 4}
          stamp: {p: 0.15}
          punch_holes: {p: 0.12}
      # A bound file/report photographed open: stronger perspective, book
      # curvature near the spine and a border that is more often clipped.
      phone_book:
        weight: 0.40
        degradations:
          perspective: {beta: [2, 6], range: [0.0, 0.13], round: 4}
          page_curl: {beta: [1.8, 6], range: [0.0, 0.11], round: 4}
          edge_crop: {beta: [1.8, 8], range: [0.0, 0.16], round: 4}
          shadow_strength: {beta: [1.6, 3.5], range: [0.0, 0.6], round: 3}
          stamp: {p: 0.25}
          punch_holes: {p: 0.20}
      # Dim office/archive-room lighting: more sensor noise, motion blur,
      # illumination gradient/shadow and lower JPEG quality.
      low_light:
        weight: 0.25
        degradations:
          illumination: {beta: [2, 2.5], range: [0.0, 0.6], round: 3}
          shadow_strength: {beta: [2, 3], range: [0.0, 0.65], round: 3}
          blur_sigma: {lognormal: [0.1, 0.5], clip: [0.0, 3.2], round: 2}
          motion_blur_px: {choices: [0, 3, 5, 7, 9], weights: [0.25, 0.25, 0.25, 0.15, 0.1]}
          noise_sigma: {lognormal: [2.1, 0.35], clip: [0.0, 24.0], round: 2}
          jpeg_quality: {normal: [55, 10], clip: [25, 80], round: 0}
          page_curl: {beta: [1.5, 20], range: [0.0, 0.06], round: 4}
          edge_crop: {beta: [1.5, 15], range: [0.0, 0.09], round: 4}
          stamp: {p: 0.15}
          punch_holes: {p: 0.12}
