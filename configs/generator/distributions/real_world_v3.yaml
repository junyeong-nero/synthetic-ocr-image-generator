# General-purpose "real-world document OCR" distribution profile, v3.
#
# v3 starts as a copy of real_world_v2 (v2.1) and is where structure, content
# and layout realism features are switched on: realistic tables, page
# typography, Korean document conventions, page furniture, capture artifacts
# and scenarios, figures, forms. real_world_v2 stays as the calibrated record
# of docs/calibration/real_world_v2.md.
#
# Values marked [measured] come from the v2 calibration run against XFUND zh+ja
# validation forms (100 scanned pages) and the 18 OmniDocBench demo pages.
# Numbers marked [sourced] come from published dataset statistics.
# Numbers marked [prior] are engineering priors that should be re-fit with
#   uv run main.py distribution measure --images <real images> --suggest-yaml ...
# once you have a reference image set (see docs/distribution.md).
id: real_world_v3
version: "3"
description: >
  Mixed born-digital / scanned / photographed pages with realistic document
  structure. Family mix and block weights follow DocLayNet page and element
  statistics; capture channels and degradations follow the real_world_v2
  calibration; structure, content and layout features are priors to be
  calibrated against your target data.

sources:
  - name: XFUND (zh, ja validation)
    url: https://github.com/doc-analysis/XFUND
    used_for: "[measured] scanned dpi, skew, grayscale/binary rates, noise, ink density"
  - name: OmniDocBench demo pages
    url: https://github.com/opendatalab/OmniDocBench/tree/main/demo_data
    used_for: "[measured] born-digital dpi, colorful background rate (2/18), fuzzy scan rate (2/18), jpeg"
  - name: DocLayNet
    url: https://github.com/DS4SD/DocLayNet
    used_for: family_mix, block_weights
    notes: >
      80,863 pages. Categories: Financial Reports 32%, Manuals 21%, Scientific
      Articles 17%, Laws & Regulations 16%, Patents 8%, Government Tenders 6%.
      Element instances: Text 510,377; List-item 185,660; Section-header
      142,884; Page-footer 70,878; Page-header 58,022; Picture 45,976;
      Table 34,733; Formula 25,027; Caption 22,524; Footnote 6,318; Title 5,071.
  - name: OmniDocBench
    url: https://github.com/opendatalab/OmniDocBench
    used_for: capture channel taxonomy (fuzzy_scan / watermark / colorful_background attributes)
  - name: ADF scanner skew study
    url: https://www.researchgate.net/publication/224341611_Estimating_the_Skew_Angle_of_Scanned_Document_through_Background_Area_Information
    used_for: scanned.skew_deg
    notes: 300 A4 sheets through an automatic feeder; 3 sigma of skew within +-1.5 deg.

# DocLayNet category -> template family mapping [sourced, then blended]:
#   Financial Reports 32% + Laws 16%       -> business   (48%)
#   Manuals 21% + half of Patents 4%       -> technical  (25%)
#   Scientific 17% + half of Patents 4%    -> academic   (21%)
#   Government Tenders 6%                  -> forms      (6%)
# DocLayNet has no receipts / meeting notes / forms, which are common in OCR
# workloads, so 20% of the mass is moved to forms + operations [prior].
family_mix:
  business: 0.38
  technical: 0.20
  academic: 0.17
  forms: 0.15
  operations: 0.10

# Template weight multipliers on the catalog weight (unlisted templates keep
# 1.0, 0 excludes) [prior]. Within a family, templates are drawn in proportion
# to catalog weight x multiplier. Pages of nothing but display formulas do not
# occur in real documents. Pages of only tables (financial statements,
# annexes) do, but less often than mixed pages: 0.6 gives table_heavy
# (catalog weight 0.8) about a third of the forms family.
template_weights:
  formula_heavy: 0.0
  table_heavy: 0.6

# Relative weights for filling non-required block slots [sourced from DocLayNet
# element shares]. List-items are counted per item in DocLayNet but our list
# blocks hold 3-5 items, so list shares are divided by ~4. Captions and
# footnotes are folded into paragraph. Headers/titles are produced by the
# composer structurally and are not weighted here.
block_weights:
  paragraph: 48.7
  bullet_list: 2.1
  numbered_list: 1.5
  checklist: 0.6
  image: 4.2
  table: 3.1
  formula: 2.3
  quote: 0.8
  code: 0.8
  command: 0.4
  rule: 0.4

# Content density on one sheet [measured]: real pages have ~2-4x the ink
# coverage of v1 output (ink_ratio 5-11% vs 2.5%), so documents get more
# sections, extra blocks and longer paragraphs.
content:
  # [measured] v2 pilots: one `##` heading per short block left pages mostly
  # whitespace; real pages have fewer headings and long running text.
  section_count_scale: {uniform: [0.7, 1.2]}
  extra_blocks_per_section: {choices: [1, 2, 2, 3]}
  paragraph_max_chars: {normal: [900, 220], clip: [300, 1500], round: 0}
  paragraph_parts: {choices: [2, 3, 4], weights: [0.3, 0.45, 0.25]}
  # Real pages have almost no look-alike typos, so do not inject them into the
  # image and GT (the CLI's --similar-char-ratio still overrides this).
  similar_char_ratio: 0.0
  # [prior] Table content now uses coherent schemas (semantic columns,
  # internally-consistent numbers) instead of the legacy unrelated columns.
  # The 32% Financial Reports + 16% Laws share of DocLayNet that feeds this
  # profile's family_mix (see the mapping above) reads as financial
  # statements and order/budget tables, so financial and order tables
  # dominate; schedule/roster/statistics round out forms and operations
  # pages. Table-schema selection is independent of family_mix, so weights
  # are set for the overall page mix rather than per family.
  table_schemas: {financial: 4, order: 2, budget: 1, schedule: 1, roster: 1, statistics: 1}
  # [sourced] SciTSR (Chi et al. 2019, https://arxiv.org/abs/1908.04729):
  # 2,885 of 12,000 train and 716 of 3,000 test tables (~24%) have at least
  # one spanning cell. Share of schema tables written as a merged-cell HTML
  # <table> (multi-level headers, row groups; src/generator/html_table.py).
  # SciTSR is scientific papers; financial and administrative tables likely
  # merge more often, so treat 0.25 as a floor to re-fit on target data.
  merged_table_ratio: 0.25

# Sheet geometry [measured]: real pages have aspect ~1.41 (A4); Letter 1.29.
# Margins [prior]: mixes Korean HWP page-setup defaults (top 20mm + 15mm
# header zone = 35mm effective top margin, bottom 15mm, left/right 30mm) with
# Word's 1-inch (25.4mm) "Normal" margins on all four sides. v1 output used
# 4-7% margins; real A4 pages run 8-14%, which these values land in.
# Re-fit the split once you have a labeled reference set.
page:
  aspect_ratio: {choices: [1.414, 1.294], weights: [0.85, 0.15]}
  margins_mm:
    top: {choices: [35, 25.4], weights: [0.55, 0.45]}
    bottom: {choices: [15, 25.4], weights: [0.55, 0.45]}
    left: {choices: [30, 25.4], weights: [0.55, 0.45]}
    right: {choices: [30, 25.4], weights: [0.55, 0.45]}
  # [prior] No source gives a two-column-page census. Academic (conference
  # paper / journal) layout is the classic two-column case, technical manuals
  # occasionally use it (reference tables, glossaries); every other family
  # keeps `default`'s small global share.
  columns:
    default: {choices: [1, 2], weights: [0.95, 0.05]}
    by_family:
      academic: {choices: [1, 2], weights: [0.6, 0.4]}
      technical: {choices: [1, 2], weights: [0.85, 0.15]}
  column_gap_mm: {uniform: [5, 10]}   # [prior] typical two-column gutter

# Body fonts [measured]: v1 output had ~half the ink contrast of real pages;
# hairline / light weights, the monospace coding font, archaic-Hangul variants
# and display weights are rare as body text in real documents.
# [prior] fonts.body/heading/code bias font choice by role instead of a flat
# random pick over every remaining file: after `exclude`, 20 of 25 fonts are
# Nanum and 8 are NanumSquare display faces, so an unweighted pick over-uses
# the square/display family as body text. Headings get the square/display
# faces (fitting for a heading, wrong for body); code keeps the excluded
# monospace face, since fonts.code is not narrowed by `exclude`.
fonts:
  exclude: [UltraLight, Light, SquareL, RoundL, _acL, HumanEL, Neo-aLt, YetHangul,
            D2Coding, ExtraBold, Heavy, EB.ttf, Neo-dEb, Neo-eHv]
  body: {Myeongjo: 3, batang: 2, Gothic: 2}
  heading: {Gothic: 3, Myeongjo: 2, NanumSquare: 1}
  code: [D2Coding]

# Physical typography on a virtual A4 page [prior: typical 9-12pt body text].
typography:
  body_font_pt: {normal: [10.5, 0.8], clip: [8.5, 13.0], round: 1}
  line_spacing: {normal: [1.35, 0.1], clip: [1.1, 1.7], round: 2}
  colored_background: {p: 0.11}   # [measured] OmniDocBench demo 2/18 pages
  spacing_scale: {uniform: [0.45, 0.8]}   # [measured] tighter block margins than web CSS
  ink_gray: {beta: [1.5, 6], range: [0, 60], round: 0}   # [measured] near-black print ink
  colored_headings: {p: 0.45}   # [measured] OmniDocBench demo: ~56% of pages are not grayscale
  # [prior] Korean word processors default to justified ("양쪽정렬") body text
  # and word-break: keep-all (line breaks fall between words, not mid-syllable).
  text_align: {choices: [justify, left], weights: [0.65, 0.35]}
  word_break: {choices: [keep-all, normal], weights: [0.75, 0.25]}
  # [prior] No source gives a table-style census; "web" (light borders,
  # header shading, zebra rows) is the common office-suite default, "grid"
  # and "header_shaded" are the next most common printed/office looks,
  # "booktabs" is common in academic/technical writing (LaTeX default),
  # "borderless" is rare outside minimalist design documents.
  table_style:
    choices: [web, grid, header_shaded, booktabs, borderless]
    weights: [0.35, 0.25, 0.15, 0.15, 0.10]

capture_channels:
  born_digital:
    weight: 0.45
    # [measured] OmniDocBench demo median ~194 dpi, JPEG sources.
    dpi: {choices: [150, 200, 300], weights: [0.25, 0.45, 0.30]}
    degradations:
      jpeg_quality: {choices: [null, 95, 90, 85], weights: [0.3, 0.3, 0.2, 0.2]}
      noise_sigma: {lognormal: [0.3, 0.5], clip: [0.0, 4.0], round: 2}

  scanned:
    weight: 0.40
    # [measured] XFUND scans are 300 dpi; keep some 200 dpi office scans.
    dpi: {choices: [200, 300], weights: [0.3, 0.7]}
    degradations:
      skew_deg: {normal: [-0.1, 0.3], clip: [-1.5, 1.5], round: 2}   # [measured]
      paper_tint: {p: 0.12}   # [measured] XFUND scans are white-balanced
      ink_fade: {beta: [1.5, 10], range: [0.0, 0.3], round: 3}
      bleed_through: {beta: [1.2, 14], range: [0.0, 0.15], round: 3}
      blur_sigma: {lognormal: [-1.0, 0.4], clip: [0.0, 1.2], round: 2}
      noise_sigma: {lognormal: [0.8, 0.4], clip: [0.0, 8.0], round: 2}   # [measured] median ~1.8
      speckle_density: {beta: [1.2, 800], range: [0.0, 0.005], round: 5}
      grayscale: {p: 0.9}      # [measured] XFUND 100% grayscale
      binarize: {p: 0.05}      # [measured] XFUND 3%
      binarize_method: {choices: [otsu, adaptive], weights: [0.7, 0.3]}   # [prior] used only when binarize is true
      jpeg_quality: {normal: [85, 6], clip: [60, 95], round: 0}
      # [prior] Capture artifacts (Task 2): office scans occasionally carry a
      # seal, a highlighter mark-up, a binder crease/holes, a flatbed edge
      # shadow or faint toner streaks. Re-fit with `distribution measure`.
      stamp: {p: 0.06}
      highlighter: {p: 0.05}
      fold_lines: {choices: [0, 1], weights: [0.92, 0.08]}
      punch_holes: {p: 0.10}
      scanner_border: {beta: [1.2, 20], range: [0.0, 0.5], round: 3}
      toner_streaks: {choices: [0, 0, 0, 1, 2], weights: [0.7, 0.1, 0.1, 0.06, 0.04]}

  photographed:
    weight: 0.15
    dpi: {normal: [180, 40], clip: [100, 300], round: 0}
    degradations:
      skew_deg: {normal: [0.0, 2.0], clip: [-6.0, 6.0], round: 2}
      perspective: {beta: [2, 12], range: [0.0, 0.07], round: 4}
      illumination: {beta: [2, 4], range: [0.0, 0.4], round: 3}
      shadow_strength: {beta: [1.5, 6], range: [0.0, 0.45], round: 3}
      blur_sigma: {lognormal: [-0.5, 0.5], clip: [0.0, 2.0], round: 2}
      motion_blur_px: {choices: [0, 0, 0, 3, 5]}
      noise_sigma: {lognormal: [1.4, 0.4], clip: [0.0, 14.0], round: 2}
      paper_tint: {p: 0.7}
      jpeg_quality: {normal: [78, 8], clip: [45, 95], round: 0}
      # [prior] Capture artifacts (Task 2): a phone photo of a bound/creased
      # page shows book curvature and often misses part of the border; stamps
      # and punch holes carry over from the physical page. Re-fit with
      # `distribution measure`.
      page_curl: {beta: [1.5, 25], range: [0.0, 0.05], round: 4}
      edge_crop: {beta: [1.5, 20], range: [0.0, 0.08], round: 4}
      stamp: {p: 0.04}
      punch_holes: {p: 0.05}
