# Qwen3-VL-2B Model Configuration
model_id: Qwen/Qwen3-VL-2B-Instruct
backend: transformers
dependency_group: qwen3-vl

# Default generation parameters
temperature: 0.0
max_tokens: 2048
top_p: 1.0
batch_size: 4
timeout: 180
max_retries: 3

# Local model specific
device: cuda
dtype: bfloat16
tensor_parallel_size: 1

# Default prompts for each format type
prompts:
    sentence:
        prompt: "qwenvl markdown"
    table:
        prompt: "qwenvl markdown"
    document:
        prompt: "qwenvl markdown"
    markdown:
        prompt: "qwenvl markdown"
    kie:
        prompt: "qwenvl markdown"
