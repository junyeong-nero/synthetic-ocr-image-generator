model_id: ./weights/DotsOCR
backend: transformers
dependency_group: dots-ocr

temperature: 0.0
max_tokens: 24000
top_p: 1.0
batch_size: 1
timeout: 300
max_retries: 3

device: cuda
dtype: bfloat16
tensor_parallel_size: 1

prompts:
    sentence:
        prompt: "Extract the document as markdown in natural reading order. Use markdown tables and LaTeX for formulas. Output markdown only."
    table:
        prompt: "Extract the document as markdown in natural reading order. Use markdown tables and LaTeX for formulas. Output markdown only."
    document:
        prompt: "Extract the document as markdown in natural reading order. Use markdown tables and LaTeX for formulas. Output markdown only."
    markdown:
        prompt: "Extract the document as markdown in natural reading order. Use markdown tables and LaTeX for formulas. Output markdown only."
    kie:
        prompt: "Extract the document as markdown in natural reading order. Use markdown tables and LaTeX for formulas. Output markdown only."
