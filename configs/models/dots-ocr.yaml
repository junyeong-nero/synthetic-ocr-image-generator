model_id: ./weights/DotsOCR
backend: transformers
dependency_group: dots-ocr
temperature: 0.0
max_tokens: 4096
top_p: 1.0
batch_size: 1
timeout: 300
max_retries: 3
device: cuda
dtype: bfloat16
tensor_parallel_size: 1
prompt:
  prompt: Extract the document as markdown in natural reading order. Use markdown
    tables and LaTeX for formulas. Output markdown only.
