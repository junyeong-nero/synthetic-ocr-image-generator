# Model Configuration Template
# Copy this file and customize for your model
#
# File naming convention:
#   - Use lowercase model name: gpt-4o.yaml, claude-3-5-sonnet.yaml
#   - For HuggingFace models, use the last part: qwen2-vl-7b.yaml
#   - Or full path with underscore: qwen_qwen2-vl-7b-instruct.yaml

# Required fields
model_id: your-model-id # e.g., "gpt-4o", "Qwen/Qwen2-VL-7B-Instruct"
backend: openai # openai, anthropic, google, transformers, vllm, sglang, ollama

# Generation parameters (optional, these are defaults)
temperature: 0.0
max_tokens: 4096
top_p: 1.0
batch_size: 1
timeout: 120
max_retries: 3

# API-specific (for openai, anthropic, google backends)
# api_base: https://custom-api.example.com/v1  # Optional custom endpoint
# rate_limit_rpm: 500  # Optional rate limit

# Local model specific (for transformers, vllm backends)
# device: cuda
# dtype: bfloat16
# tensor_parallel_size: 1
# max_model_len: 32768

# Default prompts for each format type
# These will be used unless a subset-specific prompt is defined
prompts:
    sentence:
        prompt: |
            Extract all text from the image verbatim.
            Include any typos or errors exactly as they appear.
            Do not translate or modify any characters.
            Return only the extracted text.

    table:
        prompt: |
            Extract the table from this image as HTML format.
            Use proper <table>, <thead>, <tbody>, <tr>, <th>, <td> tags.
            Return only one HTML <table>...</table> block.
            Do not include markdown fences, explanations, or extra text.

    document:
        prompt: |
            Extract all text elements from this document.
            Return valid JSON only (no markdown fences).
            JSON schema: {"elements": [{"type": "...", "text": "...", "bounding_box": [x1,y1,x2,y2], "reading_order": N, "metadata": {}}]}

    markdown:
        prompt: |
            Extract the markdown content from this image.
            Return the raw markdown text exactly as shown.

    kie:
        prompt: |
            Extract key information from this document.
            Return valid JSON only (no markdown fences).
            Always include "entities" key even if empty.
            JSON schema: {"entities": {"field": "value"}, "line_items": [{"name": "...", "quantity": "...", "unit_price": "...", "total_price": "..."}]}

# Subset-specific overrides
# Use this to customize behavior for specific dataset subsets
subsets:
    # Example: Korean text subset with different prompt and batch size
    korean:
        batch_size: 4
        temperature: 0.1
        prompts:
            sentence:
                prompt: |
                    이 이미지에서 모든 텍스트를 추출하세요.
                    오타나 오류를 포함하여 정확히 그대로 출력하세요.

    # Example: Another subset with different settings
    # chinese:
    #   batch_size: 2
    #   prompts:
    #     sentence:
    #       prompt: |
    #         Extract Chinese text from the image exactly as shown.
