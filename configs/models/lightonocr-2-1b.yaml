# LightOnOCR-2-1B Model Configuration
# https://huggingface.co/lightonai/LightOnOCR-2-1B
model_id: lightonai/LightOnOCR-2-1B
backend: transformers
dependency_group: lighton-ocr2

# Default generation parameters
temperature: 0.0
max_tokens: 1024
top_p: 1.0
batch_size: 1
timeout: 180
max_retries: 3

# Local model specific
device: cuda # Will auto-detect: mps for Apple Silicon, cuda for NVIDIA
dtype: bfloat16 # Use float32 for MPS devices
tensor_parallel_size: 1

# Default prompts for each format type
# LightOnOCR uses chat template format - prompts are minimal since model is OCR-specialized
prompts:
    sentence:
        prompt: |
            Extract all text from this image exactly as shown.

    table:
        prompt: |
            Extract the table from this image and format it as HTML.
            Use <table>, <tr>, <th>, <td> tags.

    document:
        prompt: |
            Extract all text elements from this document as a single JSON object.
            Return valid JSON only. Do not use markdown fences, explanations, or extra wrapper keys.
            Required schema:
            {"elements": [{"type": "...", "text": "...", "bounding_box": [x1, y1, x2, y2], "reading_order": N, "metadata": {}}]}
            Bounding box rules:
            - Use absolute pixel coordinates in the original image coordinate space.
            - Use [x1, y1, x2, y2] where x1 < x2 and y1 < y2.
            - Each box should cover the full visual region of the element (line/block), not a narrow character strip.
            - reading_order must be sequential integers starting at 0.

    markdown:
        prompt: |
            Extract the content from this image as markdown format.

    kie:
        prompt: |
            Extract key information from this document.
            Return as JSON: {"entities": {"field": "value"}}
