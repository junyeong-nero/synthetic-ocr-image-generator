# Qwen2.5-VL-7B Model Configuration
model_id: Qwen/Qwen2.5-VL-7B-Instruct
backend: transformers
dependency_group: qwen2.5-vl

# Default generation parameters
temperature: 0.0
max_tokens: 2048
top_p: 1.0
batch_size: 1
timeout: 300
max_retries: 3

# Local model specific
device: cuda
dtype: bfloat16
tensor_parallel_size: 1

# Default prompts for each format type
prompts:
    sentence:
        prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
    table:
        prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
    document:
        prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
    markdown:
        prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
    kie:
        prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
# Subset-specific overrides
subsets:
    korean:
        prompts:
            sentence:
                prompt: "Convert the image content to markdown while preserving headings, lists, tables, and formulas. Output markdown only."
