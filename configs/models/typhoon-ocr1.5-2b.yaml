model_id: scb10x/typhoon-ocr1.5-2b
backend: transformers
dependency_group: typhoon-ocr

temperature: 0.0
max_tokens: 10000
top_p: 1.0
batch_size: 1
timeout: 300
max_retries: 3

device: cuda
dtype: bfloat16
tensor_parallel_size: 1

prompts:
    sentence:
        prompt: |
            Extract all text from the image verbatim.
            Include typos exactly as shown. Do not translate.

    table:
        prompt: |
            Extract the table from this image as HTML format.
            Use <table>, <tr>, <th>, <td> tags properly.

    document:
        prompt: |
            Extract text elements from this document as JSON.
            Format: {"elements": [{"type": "...", "text": "...", "reading_order": N}]}

    markdown:
        prompt: |
            Extract markdown content from this image exactly as shown.

    kie:
        prompt: |
            Extract key information as JSON.
            Format: {"entities": {"field": "value"}, "line_items": [...]}
