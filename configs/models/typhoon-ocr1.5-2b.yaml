model_id: scb10x/typhoon-ocr1.5-2b
backend: transformers
dependency_group: typhoon-ocr

temperature: 0.0
max_tokens: 10000
top_p: 1.0
batch_size: 1
timeout: 300
max_retries: 3

device: cuda
dtype: bfloat16
tensor_parallel_size: 1

prompts:
    sentence:
        prompt: |
            Extract all text from the image verbatim.
            Include typos exactly as shown. Do not translate.

    table:
        prompt: |
            Extract the table from this image as HTML format.
            Use <table>, <tr>, <th>, <td> tags properly.

    document:
        prompt: |
            Extract all text elements from this document as a single JSON object.
            Return valid JSON only. Do not use markdown fences, explanations, or extra wrapper keys.
            Required schema:
            {"elements": [{"type": "...", "text": "...", "bounding_box": [x1, y1, x2, y2], "reading_order": N, "metadata": {}}]}
            Bounding box rules:
            - Use absolute pixel coordinates in the original image coordinate space.
            - Use [x1, y1, x2, y2] where x1 < x2 and y1 < y2.
            - Each box should cover the full visual region of the element (line/block), not a narrow character strip.
            - reading_order must be sequential integers starting at 0.

    markdown:
        prompt: |
            Extract markdown content from this image exactly as shown.

    kie:
        prompt: |
            Extract key information as JSON.
            Format: {"entities": {"field": "value"}, "line_items": [...]}
