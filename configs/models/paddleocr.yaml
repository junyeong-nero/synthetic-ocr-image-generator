model_id: paddleocr/paddle-ocr
backend: paddleocr
dependency_group: paddle-ocr
batch_size: 1
timeout: 60
max_retries: 3
subsets:
  korean:
    model_id: paddleocr/korean
    prompt:
      prompt: ignored
  english:
    model_id: paddleocr/en
    prompt:
      prompt: ignored
  chinese:
    model_id: paddleocr/ch
    prompt:
      prompt: ignored
  japanese:
    model_id: paddleocr/japan
    prompt:
      prompt: ignored
prompt:
  prompt: ignored
