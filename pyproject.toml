[project]
name = "synthetic-ocr-image-benchmark"
version = "0.1.0"
description = "Synthetic OCR image generator and VLM evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.2.0",
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "scikit-image>=0.25.2",
    "pyyaml>=6.0",
    "huggingface-hub[cli]>=0.35.3",
    "plotly>=6.4.0",
    "statsmodels>=0.14.5",
    "torch==2.6.0",
    "torchvision>=0.20.0",
    "accelerate>=1.12.0",
    "pydantic>=2.0.0",
    "tqdm>=4.60.0",
    "numpy>=1.24.0",
    "addict>=2.4.0",
    "einops>=0.8.2",
    "easydict>=1.13",
]

[project.optional-dependencies]
api = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
]
eval = [
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]
transformers = ["transformers==4.46.3", "tokenizers==0.20.3"]
# NOTE: Install backends separately to avoid dependency conflicts:
#   uv sync --extra api --extra eval
#   uv sync --extra api --extra eval --extra transformers

[tool.uv]
# Resolve for current platform only (avoid cross-platform conflicts)
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = true

[tool.setuptools]
packages = ["evaluation", "models", "metrics", "generator"]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
