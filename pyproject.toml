[project]
name = "synthetic-ocr-image-benchmark"
version = "0.1.0"
description = "Synthetic OCR image generator and VLM evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.2.0",
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "scikit-image>=0.25.2",
    "pyyaml>=6.0",
    "huggingface-hub[cli]>=0.35.3",
    "plotly>=6.4.0",
    "statsmodels>=0.14.5",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "accelerate>=1.12.0",
    "pydantic>=2.0.0",
    "tqdm>=4.60.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
eval = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]
# vLLM: Linux (CUDA) + macOS (experimental, requires source build or vllm-metal)
# SGLang: Linux only (CUDA required, no macOS support)
vllm = ["vllm>=0.6.0"]
sglang = ["sglang[all]>=0.3.0; sys_platform == 'linux'"]
ollama = ["ollama>=0.3.0"]
transformers = ["transformers>=4.40.0"]
# NOTE: vllm, sglang, transformers have conflicting dependencies
# Install each backend separately:
#   uv sync --extra eval --extra vllm
#   uv sync --extra eval --extra sglang
#   uv sync --extra eval --extra transformers
# Do NOT install them together

[tool.uv]
# Resolve for current platform only (avoid cross-platform conflicts)
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = true

[tool.setuptools]
packages = ["evaluation", "models", "metrics", "generator"]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
