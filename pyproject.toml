[project]
name = "synthetic-ocr-image-benchmark"
version = "0.1.0"
description = "Synthetic OCR image generator and VLM evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.2.0",
    "faker>=37.0.0",
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "scikit-image>=0.25.2",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23.0",
    "plotly>=6.4.0",
    "statsmodels>=0.14.5",
    "torch==2.6.0",
    "torchvision>=0.20.0",
    "accelerate>=1.12.0",
    "pydantic>=2.0.0",
    "tqdm>=4.60.0",
    "numpy>=1.24.0",
    "mistune>=3.0.0",
    "markdown>=3.8",
    "html2image>=2.0.5",
    "addict>=2.4.0",
    "einops>=0.8.2",
    "easydict>=1.13",
]

[project.optional-dependencies]
api = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
]
eval = [
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
]
transformers = ["transformers==4.46.3", "tokenizers==0.20.3"]
# NOTE: Use groups for isolated installs:
#   uv sync --group generate
#   uv sync --group evaluate
#   uv sync --group api

[dependency-groups]
# Individual model groups with their specific requirements
# Usage: uv sync --group <model-name>

api = [
    "opencv-python>=4.12.0.88",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
]

generate = [
    "datasets>=4.2.0",
    "faker>=37.0.0",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "scikit-image>=0.25.2",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.60.0",
    "numpy>=1.24.0",
    "mistune>=3.0.0",
    "markdown>=3.8",
    "html2image>=2.0.5",
]

evaluate = [
    "datasets>=4.2.0",
    "pillow>=12.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.60.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "lxml>=5.0.0",
    "apted>=1.0.0",
]

nanonets-ocr2 = [
    "transformers==4.46.3",
    "tokenizers==0.20.3",
]

typhoon-ocr = [
    "transformers==4.46.3",
    "tokenizers==0.20.3",
]

deepseek-ocr = [
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    # Note: flash-attn requires CUDA and must be installed separately:
    # pip install flash-attn --no-build-isolation
]

deepseek-ocr2 = [
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    # Note: flash-attn requires CUDA and must be installed separately:
    # pip install flash-attn --no-build-isolation
]

lighton-ocr2 = [
    # LightOnOCR requires latest transformers from git
    "transformers @ git+https://github.com/huggingface/transformers",
    "tokenizers>=0.21.0",
    "pypdfium2>=4.0.0",
]

hunyuan-ocr = [
    # HunyuanOCR requires specific transformers commit
    "transformers @ git+https://github.com/huggingface/transformers@82a06db03535c49aa987719ed0746a76093b1ec4",
    "tokenizers>=0.21.0",
]

varco-ocr = [
    # VARCO-VISION-2.0 requires transformers >= 4.53.1
    "transformers>=4.53.1",
    "tokenizers>=0.20.3",
]

paddle-ocr = [
    # Note: paddlepaddle-gpu requires separate installation from PaddlePaddle index
    # See: https://www.paddlepaddle.org.cn/install/quick
    "paddleocr>=2.0.0",
    "paddlepaddle>=2.6.0",
]

paddle-ocr-vl = [
    "transformers>=4.53.3,<5.0.0",
    "tokenizers>=0.21.0",
    "huggingface-hub>=0.23.2,<1.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

qwen2-vl = [
    # Qwen2-VL requires transformers with Qwen2VLForConditionalGeneration support
    "transformers>=4.45.0",
    "tokenizers>=0.20.3",
    "qwen-vl-utils>=0.0.10",
]

"qwen2.5-vl" = [
    # Qwen2.5-VL requires transformers with Qwen2_5_VL support
    "transformers>=4.50.0",
    "tokenizers>=0.21.0",
    "qwen-vl-utils>=0.0.10",
]

qwen3-vl = [
    # Qwen3-VL requires transformers >= 4.57.0
    "transformers>=4.57.0",
    "tokenizers>=0.21.0",
    "qwen-vl-utils>=0.0.10",
]

gemma3 = [
    "transformers>=4.50.0",
    "tokenizers>=0.20.3",
]

got-ocr = [
    # GOT-OCR-2.0-hf requires transformers >= 4.49.0
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
]

glm-ocr = [
    # GLM-OCR requires latest transformers from git
    "transformers @ git+https://github.com/huggingface/transformers",
    "tokenizers>=0.20.3",
]

kiri-ocr = [
    "kiri-ocr>=0.1.0",
]

dots-ocr = [
    "transformers==4.51.3",
    "tokenizers>=0.21.0",
    "qwen-vl-utils>=0.0.10",
]

[tool.uv]
# Resolve for current platform only (avoid cross-platform conflicts)
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
package = true

# Declare that model-specific dependency groups are mutually exclusive
# This allows uv to resolve them independently despite conflicting requirements
conflicts = [
    [
        { extra = "transformers" },
        { group = "nanonets-ocr2" },
        { group = "typhoon-ocr" },
        { group = "deepseek-ocr" },
        { group = "deepseek-ocr2" },
        { group = "lighton-ocr2" },
        { group = "hunyuan-ocr" },
        { group = "varco-ocr" },
        { group = "paddle-ocr" },
        { group = "paddle-ocr-vl" },
        { group = "qwen2-vl" },
        { group = "qwen2.5-vl" },
        { group = "qwen3-vl" },
        { group = "gemma3" },
        { group = "got-ocr" },
        { group = "glm-ocr" },
        { group = "kiri-ocr" },
        { group = "dots-ocr" },
    ],
]

# Don't include any model groups by default
default-groups = []

[tool.setuptools]
packages = ["evaluation", "models", "metrics", "generator"]
package-dir = {"" = "src"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
